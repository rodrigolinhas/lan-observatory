name: 🐛 Bug Report
description: Report a bug or unexpected behavior in LAN Observatory
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do **NOT** include private network passwords, sensitive external IPs, or proprietary credential tokens in this report. Synthetic subnets (such as `192.0.2.0/24`) should be used in examples.

  - type: textarea
    id: description
    attributes:
      label: Summary
      description: A clear and concise description of the observed bug.
      placeholder: "e.g. When running discovery on a /24 subnet, ICMP echo latency returns 0ms for active hosts."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - CLI (Cobra commands & flags)
        - Discovery Engine (CIDR validation / worker pool)
        - ICMP Probing & Raw Sockets
        - Inventory & Normalization
        - Storage & Persistence (M3+)
        - Terminal UI (Bubble Tea - M5+)
        - Logging & Telemetry (log/slog)
        - Build / CI / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Compile binary: `go build -o bin/lanobs ./cmd/lanobs`
        2. Run: `./bin/lanobs discover 192.168.1.0/24`
        3. Observe the output or error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include sanitized CLI output or error messages).
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Host environment, OS distribution, Go version, and network configuration.
      value: |
        - OS: [e.g. Linux (Ubuntu 24.04 / Debian 12 / Arch), macOS, Windows]
        - Kernel Version: [e.g. Linux 6.8.0]
        - Go Version: [e.g. 1.27]
        - Privileges: [e.g. unprivileged user with sysctl ping_group_range / CAP_NET_RAW / root]
        - Network Interface: [e.g. Ethernet / Wi-Fi / Virtual Bridge]
    validations:
      required: false
